name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL for the APK"
        required: false
        default: "http://10.0.2.2:8000/api/v1"
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ github.event.inputs.api_base || 'http://10.0.2.2:8000/api/v1' }}
        run: |
          npm install
          echo "VITE_API_BASE=$VITE_API_BASE" > .env.production
          npm run build

      - name: Scaffold Capacitor Android
        run: |
          mkdir -p packaging/android
          cd packaging/android
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.diecutting.app",
            "appName": "DieCutting",
            "webDir": "../../frontend/dist",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          CFG
          npx cap add android
          npx cap sync android

      - name: Enable cleartext traffic
        run: |
          MANIFEST=packaging/android/android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("packaging/android/android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          if "usesCleartextTraffic" not in t:
              t = t.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              p.write_text(t)
          print("manifest ok")
          PY
          fi

      - name: Build Debug APK
        working-directory: packaging/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DieCutting-android-debug-apk
          path: packaging/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/android/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
