name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL for the APK (e.g. https://example.com/api/v1)"
        required: false
        default: "http://10.0.2.2:8000/api/v1"
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build frontend with API base
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ github.event.inputs.api_base || 'http://10.0.2.2:8000/api/v1' }}
        run: |
          npm install
          # Ensure production build uses VITE_API_BASE
          echo "VITE_API_BASE=$VITE_API_BASE" > .env.production
          npm run build

      - name: Scaffold Capacitor Android
        working-directory: packaging/android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DieCutting" "com.diecutting.app" --web-dir ../../frontend/dist || true
          # Write capacitor config if missing
          cat > capacitor.config.json << 'CFG'
          {
            "appId": "com.diecutting.app",
            "appName": "模切流程系统",
            "webDir": "../../frontend/dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          CFG
          npx cap add android || true
          npx cap sync android

      - name: Enable cleartext HTTP (debug)
        run: |
          MANIFEST="packaging/android/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST" || true
          fi

      - name: Build Debug APK
        working-directory: packaging/android/android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DieCutting-android-debug-apk
          path: packaging/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/android/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
