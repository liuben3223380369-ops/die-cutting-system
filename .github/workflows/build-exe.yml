name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy static assets
        shell: pwsh
        run: |
          if (Test-Path backend/static) { Remove-Item -Recurse -Force backend/static }
          New-Item -ItemType Directory -Path backend/static | Out-Null
          Copy-Item -Recurse frontend/dist/* backend/static/

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile --console `
            --name DieCuttingSystem `
            --paths backend `
            --add-data "backend/app;app" `
            --add-data "backend/static;static" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import sqlalchemy.dialects.sqlite `
            --hidden-import aiosqlite `
            packaging/desktop/launcher.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DieCuttingSystem-windows-exe
          path: dist/DieCuttingSystem.exe
          if-no-files-found: error

      - name: Attach EXE to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DieCuttingSystem.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
